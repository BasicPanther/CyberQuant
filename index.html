<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberQuant — Cyber Risk Quantification</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .scenario-sliders{display:grid;grid-template-columns:repeat(2,1fr);gap:0 28px}.rangebox{padding:14px 0;border-bottom:1px solid var(--border)}.rangebox label{display:flex;justify-content:space-between;color:#b9c7d6;font-size:12px}.rangebox label b{color:var(--blue)}.scenario-range{width:100%;accent-color:var(--blue);margin-top:12px}.scenario-results{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:15px}.result{background:#0c121a;border:1px solid var(--border);padding:14px}.result label{display:block;color:var(--muted);font-size:11px}.result strong{display:block;font-size:23px;margin-top:7px}.formula{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.6;margin:16px 0}@media(max-width:760px){.scenario-sliders{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
